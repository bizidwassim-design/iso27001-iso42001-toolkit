name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Rebuild the workbooks and CSV twins from data/
        run: python scripts/build_templates.py
      - name: CSV twins must match the committed data
        run: git diff --exit-code -- templates/*.csv
      - name: Workbooks open, contain no macros, control counts are right
        run: |
          python - <<'EOF'
          from openpyxl import load_workbook
          soa = load_workbook("templates/Statement-of-Applicability.xlsx")
          n27 = sum(1 for r in soa["ISO 27001 Annex A"].iter_rows(min_row=5, max_col=1) if r[0].value)
          n42 = sum(1 for r in soa["ISO 42001 Annex A"].iter_rows(min_row=5, max_col=1) if r[0].value)
          assert (n27, n42) == (93, 38), (n27, n42)
          for f in ("Statement-of-Applicability", "Risk-Treatment-Plan", "RACI-Matrix"):
              wb = load_workbook(f"templates/{f}.xlsx")
              assert not getattr(wb, "vba_archive", None), f"{f} must not contain macros"
          print("OK: 93 ISO 27001 controls, 38 ISO 42001 controls, no macros")
          EOF
